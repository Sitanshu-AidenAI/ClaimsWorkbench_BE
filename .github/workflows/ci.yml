name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.13"

jobs:
  # ---------------------------------------------------------------------------
  # Backend lint / format
  # ---------------------------------------------------------------------------
  ruff:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Check formatting
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Backend tests — unit and integration, against real Postgres and Redis
  # ---------------------------------------------------------------------------
  pytest:
    name: pytest
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims_workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims -d claims_workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis@sha256:9702d01c1f10c3ea9f48211b4362e44f154ff02d063e6f7268eba804059f53bf
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      CWB_ENVIRONMENT: test
      CWB_POSTGRES_HOST: localhost
      CWB_POSTGRES_PORT: "5432"
      CWB_POSTGRES_USER: claims
      CWB_POSTGRES_PASSWORD: claims
      CWB_POSTGRES_DB: claims_workbench
      CWB_REDIS_HOST: localhost
      CWB_REDIS_PORT: "6379"

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev

      - name: Apply migrations
        run: uv run alembic upgrade head

      - name: Unit tests
        run: uv run pytest -m "not integration" --cov --cov-report=xml

      - name: Integration tests
        run: uv run pytest -m integration

  # ---------------------------------------------------------------------------
  # Migration check — mapped models must match the migration history
  # ---------------------------------------------------------------------------
  migrations:
    name: migration check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres@sha256:7a396fd264a2067788b6551122b50f162bf6136312c7fc9d74381cb92c648382
        env:
          POSTGRES_USER: claims
          POSTGRES_PASSWORD: claims
          POSTGRES_DB: claims_workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U claims -d claims_workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      CWB_ENVIRONMENT: test
      CWB_POSTGRES_HOST: localhost
      CWB_POSTGRES_PORT: "5432"
      CWB_POSTGRES_USER: claims
      CWB_POSTGRES_PASSWORD: claims
      CWB_POSTGRES_DB: claims_workbench

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra dev

      - name: Upgrade to head
        run: uv run alembic upgrade head

      - name: Models match migrations
        run: uv run alembic check

      - name: Downgrade is reversible
        run: uv run alembic downgrade base

  # ---------------------------------------------------------------------------
  # Container build — proves the image still builds
  # ---------------------------------------------------------------------------
  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: claims-workbench-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
