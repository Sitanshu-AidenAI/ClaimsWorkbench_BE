[project]
name = "claims-workbench-api"
version = "0.1.0"
description = "Claims Workbench backend API"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web framework + validation
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    # ASGI / process management
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    # Database
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # Cache / broker / jobs
    "redis>=5.0",
    "celery[redis]>=5.3",
    # Object storage
    "boto3>=1.34",
    # Identity
    "pyjwt[crypto]>=2.8",
    # HTTP + resilience
    "httpx>=0.28",
    "tenacity>=9.0",
    # Observability
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=6.1",
    # Documents
    "reportlab>=5.0",
    "markdown>=3.6",
    "nh3>=0.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI relies on function calls (Depends/Query) in argument defaults
    "RUF001", # En dashes and typographic quotes are deliberate in user-facing prose:
              # these strings are read by claims officers, and "01 Jan – 31 Dec" is
              # the form a date range takes on screen.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require Postgres/Redis to be running",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
