[project]
name = "claims-workbench-api"
version = "0.1.0"
description = "Claims Workbench backend API"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    # Web framework + validation
    "fastapi>=0.110",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    # ASGI / process management
    "uvicorn[standard]>=0.29",
    "gunicorn>=22.0",
    # Database
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # Cache / broker / jobs
    "redis>=5.0",
    "celery[redis]>=5.3",
    # Object storage
    "boto3>=1.34",
    # Identity
    "pyjwt[crypto]>=2.8",
    # HTTP + resilience
    "httpx>=0.28",
    "tenacity>=9.0",
    # Observability
    "structlog>=24.1",
    "prometheus-fastapi-instrumentator>=6.1",
    # Documents
    "reportlab>=5.0",
    "markdown>=3.6",
    "nh3>=0.2",
    # Document text extraction. Every choice here is licence-constrained: this is a
    # carrier-deployed product, so AGPL (PyMuPDF/pymupdf4llm) and GPL (extract-msg)
    # are legal questions rather than technical ones, and both have permissive
    # equivalents that cover what the pipeline needs.
    "pypdfium2>=4.30",   # per-page PDF text and page rasterisation (Apache-2.0/BSD-3)
    "pdfplumber>=0.11",  # PDF tables (MIT, over pdfminer.six)
    "python-docx>=1.1",  # DOCX paragraphs, headings and tables in body order (MIT)
    "openpyxl>=3.1",     # XLSX values, not formulas (MIT)
    "olefile>=0.47",     # .msg OLE container reading for forwarded Outlook mail (BSD-3)
    # Vector index. HTTP transport only, so the image needs no native gRPC build.
    # Kept in step with the server image pinned in docker-compose.yml: the client
    # warns rather than errors on a version mismatch, so drift is quiet.
    "qdrant-client>=1.19,<1.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv]
default-groups = []

# ---------------------------------------------------------------------------
# Lint / format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["app/db/migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",   # FastAPI relies on function calls (Depends/Query) in argument defaults
    "RUF001", # En dashes and typographic quotes are deliberate in user-facing prose:
              # these strings are read by claims officers, and "01 Jan – 31 Dec" is
              # the form a date range takes on screen.
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# 4,400 lines of case data, not code: twenty-four broker notices with the subject
# lines, exposure answers and rationale notes they really carry. A line limit earns
# its keep by making logic reviewable, and here it would do the opposite — the long
# lines are single string literals like an email subject, and the only way to shorten
# one is to break it into concatenated fragments. That hurts twice over. These strings
# are the ground truth the matching evaluation scores against, so a space moved across
# a fragment boundary is a silent change to an expected value; and a subject line
# split down the middle can no longer be found by grepping for the subject.
"scripts/fnol_scenarios.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
# Linted, but not reformatted. The formatter's preferred layout for this file is a
# 4,400-line rewrite — it joins the hand-aligned schedule rows onto single lines,
# which then breaks the line limit it cannot fix, so running it makes `ruff check`
# worse rather than better. The rows are tabular on purpose: a damage schedule read
# column-by-column is how you spot that one of twenty-four packs has the wrong
# currency. Excluded here rather than repo-wide, so `ruff check` still applies to it.
exclude = ["scripts/fnol_scenarios.py"]

# ---------------------------------------------------------------------------
# Tests
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --strict-markers"
markers = [
    "integration: tests that require Postgres/Redis to be running",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/db/migrations/*"]

# ---------------------------------------------------------------------------
# Types
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
